spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  application:
    name: hostelconnect-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hostelconnect}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: false
    locations: classpath:db/migration
  mail:
    host: smtp.gmail.com
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:hostelconnectgh5@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-change-in-production-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: hostelconnect-gh
  otp:
    ttl-minutes: 15
    length: 6
  lockout:
    max-attempts: 5
    lockout-minutes: 15
  frontend:
    url: ${FRONTEND_URL:https://rentl-system.vercel.app}
  admin:
    email: ${ADMIN_EMAIL:hostelconnectgh5@gmail.com}
    password: ${ADMIN_PASSWORD:Hostelconnect@1}

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:sk_live_placeholder}
  public-key: ${PAYSTACK_PUBLIC_KEY:pk_live_placeholder}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${PORT:8081}

arkesel:
  api-key: ${ARKESEL_API_KEY:}
  sender-id: ${ARKESEL_SENDER_ID:HostelConn}

imgbb:
  api-key: ${IMGBB_API_KEY:}
